name: Fetch Clash Subscribe Link

on:
  schedule:
    # 每 5 小时触发一次，第 23 分钟避开整点高峰
    - cron: '23 */5 * * *'
  workflow_dispatch:

# ===== 关键修复：并发控制 =====
# 同一分支上，新实例启动时自动取消正在运行的旧实例
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-and-fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Long-running monitor loop (up to 6h)
        run: |
          # ===== 关键修复：捕获 GitHub 的取消信号 (SIGTERM) =====
          # 当新实例启动导致本实例被取消时，立即退出循环，不要继续 sleep 或 push
          trap 'echo ">>> Workflow cancelled by newer run, exiting gracefully..."; exit 0' SIGTERM SIGINT
          
          counter=1
          while true; do
            echo "=== Check #$counter at $(date '+%Y-%m-%d %H:%M:%S') ==="
            
            # 获取对方 README.md 最新 commit SHA
            LATEST_SHA=$(curl -sL \
              -H "Accept: application/vnd.github.v3+json" \
              -H "User-Agent: GitHub-Actions-Bot" \
              "https://api.github.com/repos/tolinkshare2/tolinkshare2.github.io/commits?path=README.md&page=1&per_page=1" | \
              jq -r '.[0].sha // empty')
            
            if [ -z "$LATEST_SHA" ] || [ "$LATEST_SHA" = "null" ]; then
              echo "ERROR: Failed to fetch SHA, will retry in 5 min"
              sleep 300
              counter=$((counter + 1))
              continue
            fi
            
            echo "Latest SHA: $LATEST_SHA"
            
            # 读取本地记录的上一次 SHA
            if [ -f .last_commit_sha ]; then
              LAST_SHA=$(cat .last_commit_sha)
              echo "Last SHA: $LAST_SHA"
            else
              LAST_SHA=""
              echo "No previous SHA found"
            fi
            
            # 对比 SHA
            if [ "$LAST_SHA" = "$LATEST_SHA" ]; then
              echo "No change detected."
            else
              echo "Change detected! Fetching new subscribe link..."
              
              # 提取订阅链接
              curl -sL "https://github.com/tolinkshare2/tolinkshare2.github.io" -o page.html
              SUBSCRIBE_URL=$(grep -oP 'https://[a-zA-Z0-9]+\.tosslk\.xyz/[a-zA-Z0-9]+' page.html | head -1)
              
              if [ -z "$SUBSCRIBE_URL" ]; then
                echo "ERROR: Subscribe URL not found, will retry in 5 min"
                sleep 300
                counter=$((counter + 1))
                continue
              fi
              
              echo "Subscribe URL: $SUBSCRIBE_URL"
              
              # 下载订阅内容
              curl -sL \
                -A "clash-verge/v2.5.2" \
                -H "Accept: application/yaml, text/yaml, */*" \
                --max-time 30 \
                "$SUBSCRIBE_URL" -o subscribe_content.yaml
              
              # 检查维护提示
              if grep -q "节点加速器\|已停止维护\|官方网站\|更换下载" subscribe_content.yaml; then
                echo "ERROR: Got maintenance notice, will retry in 5 min"
                cat subscribe_content.yaml
                sleep 300
                counter=$((counter + 1))
                continue
              fi
              
              if [ ! -s subscribe_content.yaml ]; then
                echo "ERROR: Empty content, will retry in 5 min"
                sleep 300
                counter=$((counter + 1))
                continue
              fi
              
              echo "Content size: $(wc -c < subscribe_content.yaml) bytes"
              
              # 更新文件
              mkdir -p tosslk
              cp subscribe_content.yaml tosslk/tosslk
              echo "$LATEST_SHA" > .last_commit_sha
              
              # 提交推送
              git config user.name "GitHub Actions Bot"
              git config user.email "actions@github.com"
              git add tosslk/ .last_commit_sha
              
              if ! git diff --cached --quiet; then
                git commit -m "Update Clash subscribe [$(date '+%Y-%m-%d %H:%M:%S')] - Source: $SUBSCRIBE_URL"
                
                # ===== 关键修复：push 前先拉取最新代码，防止冲突 =====
                git pull --rebase origin main || true
                
                git push
                echo "Pushed successfully!"
              else
                echo "No file changes to commit"
              fi
            fi
            
            echo "Waiting 5 minutes before next check..."
            sleep 300
            counter=$((counter + 1))
          done
          
          echo "=== Job reached 6h timeout or was stopped ==="
